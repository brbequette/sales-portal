name: tdgpt

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SELFHOST_DB_NAME:-tdgpt}
      POSTGRES_USER: ${SELFHOST_DB_USER:-tdgpt}
      POSTGRES_PASSWORD: ${SELFHOST_DB_PASSWORD:-change-this-before-production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SELFHOST_DB_USER:-tdgpt} -d ${SELFHOST_DB_NAME:-tdgpt}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_QUEUE: "20"
      OLLAMA_KEEP_ALIVE: "30m"
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks: [internal]

  db-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    env_file:
      - path: .env
        format: raw
    environment:
      DATABASE_URL: postgresql://${SELFHOST_DB_USER:-tdgpt}:${SELFHOST_DB_PASSWORD:-change-this-before-production}@postgres:5432/${SELFHOST_DB_NAME:-tdgpt}
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        format: raw
    environment:
      DATABASE_URL: postgresql://${SELFHOST_DB_USER:-tdgpt}:${SELFHOST_DB_PASSWORD:-change-this-before-production}@postgres:5432/${SELFHOST_DB_NAME:-tdgpt}
      DIRECT_URL: postgresql://${SELFHOST_DB_USER:-tdgpt}:${SELFHOST_DB_PASSWORD:-change-this-before-production}@postgres:5432/${SELFHOST_DB_NAME:-tdgpt}
      NEXTAUTH_URL: ${SELFHOST_APP_URL:-http://localhost:3000}
      NEXTAUTH_ZOHO_CLIENT_ID: ${NEXTAUTH_ZOHO_CLIENT_ID:-}
      NEXTAUTH_ZOHO_CLIENT_SECRET: ${NEXTAUTH_ZOHO_CLIENT_SECRET:-}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-20000}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-45000}
      AI_MODEL: ${AI_MODEL:-qwen3:4b}
      OLLAMA_BASE_URL: http://ollama:11434/v1
      INTERNAL_SYNC_SECRET: ${INTERNAL_SYNC_SECRET:-}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db-init:
        condition: service_completed_successfully
      ollama:
        condition: service_started
    networks: [internal]

  books-sync:
    image: tdgpt-app
    restart: unless-stopped
    env_file:
      - path: .env
        format: raw
    environment:
      INTERNAL_SYNC_SECRET: ${INTERNAL_SYNC_SECRET:-}
      SYNC_INTERVAL_MS: ${BOOKS_SYNC_INTERVAL_MS:-300000}
    command:
      - node
      - -e
      - |
        const interval = Math.max(60000, Number(process.env.SYNC_INTERVAL_MS) || 300000);
        const clean = value => {
          const text = (value || '').trim();
          const wrapped = (text.startsWith('"') && text.endsWith('"')) || (text.startsWith("'") && text.endsWith("'"));
          return wrapped ? text.slice(1, -1) : text;
        };
        let consecutiveFailures = 0;
        const run = async () => {
          try {
            const response = await fetch('http://app:3000/api/internal/books-sync', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ secret: clean(process.env.INTERNAL_SYNC_SECRET || process.env.NEXTAUTH_SECRET) }),
            });
            if (!response.ok) {
              consecutiveFailures += 1;
              console.error('Books sync failed:', response.status, await response.text());
            } else {
              consecutiveFailures = 0;
              console.log('Books sync complete:', await response.text());
            }
          } catch (error) {
            consecutiveFailures += 1;
            console.error('Books sync request failed:', error);
          } finally {
            const backoff = Math.min(interval * (2 ** consecutiveFailures), 6 * 60 * 60 * 1000);
            console.log('Next Books sync in ' + Math.round(backoff / 60000) + ' minute(s)');
            setTimeout(run, backoff);
          }
        };
        run();
    depends_on:
      app:
        condition: service_healthy
    networks: [internal]

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["public"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--loglevel", "info", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
    networks: [internal]

volumes:
  postgres_data:
  ollama_data:

networks:
  internal:
    driver: bridge
