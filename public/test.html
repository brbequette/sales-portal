<!DOCTYPE html>
<html>
<head>
  <title>Titan Portal - Test</title>
  <style>
    body { font-family: sans-serif; background: #0a0a0a; color: #eee; padding: 2rem; }
    h1 { color: #10b981; }
    pre { background: #111; padding: 1rem; border-radius: 8px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>✅ iframe loaded successfully!</h1>
  <p>URL Parameters received from Zoho:</p>
  <pre id="params">Loading...</pre>
  <script>
    const params = {};
    new URLSearchParams(window.location.search).forEach((v, k) => params[k] = v);
    document.getElementById('params').textContent = 
      Object.keys(params).length ? JSON.stringify(params, null, 2) : 'No parameters received';
  </script>
</body>
</html>
