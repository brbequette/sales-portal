<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#050505" />
    <title>Titan Sales Portal — Offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#2a1204 0,#080808 42%,#000 100%);color:#fff;font-family:Arial,sans-serif}.card{width:min(440px,calc(100vw - 40px));padding:34px;text-align:center;border:1px solid #733500;border-radius:24px;background:rgba(8,8,8,.92);box-shadow:0 25px 80px #000}.card img{width:112px;border-radius:25px}.card h1{margin:20px 0 8px;font-size:26px}.card p{margin:0;color:#aaa;line-height:1.55}.card button{margin-top:24px;padding:11px 22px;border:0;border-radius:999px;background:#ff7900;color:#080808;font-weight:900;cursor:pointer}
    </style>
  </head>
  <body><main class="card"><img src="/titan-app-icon-192.png" alt="Titan Diamond USA" /><h1>You’re offline</h1><p>The Titan Sales Portal will reconnect automatically when this device is back on the network.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
