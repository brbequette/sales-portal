[build]
  command = "npx prisma generate && next build"
  publish = ".next"

[build.environment]
  DATABASE_URL = "postgresql://netlifydb_owner:npg_jvz7JFbSoEH6@ep-fragrant-salad-aj44trez.c-3.us-east-2.db.netlify.com/netlifydb?sslmode=require"
  NEXTAUTH_SECRET = "titan_diamond_sales_portal_production_secret_key_2026"
  ZOHO_DC = "com"

[[plugins]]
  package = "@netlify/plugin-nextjs"


[dev]
  port = 8888

# Allow embedding in Zoho CRM web tabs (iframes)
# CSP frame-ancestors * is the modern standard; X-Frame-Options is intentionally omitted
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *;"
    Access-Control-Allow-Origin = "*"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"



[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/account/:id"
  to = "/account?id=:id"
  status = 200

# Daily Zoho Books sync — runs at 6:00 AM UTC (2:00 AM EST) every day
[functions."daily-books-sync"]
  schedule = "0 6 * * *"
