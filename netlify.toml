[build]
  command = "echo DATABASE_URL=$DATABASE_URL >> .env.production && echo NETLIFY_DATABASE_URL=$NETLIFY_DATABASE_URL >> .env.production && npx prisma generate && next build"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[dev]
  functions = "netlify/functions"
  port = 8888

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/account/*"
  to = "/account/[id].html"
  status = 200
