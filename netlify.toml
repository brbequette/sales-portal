[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions."telegram-agent-dispatch"]
  schedule = "* * * * *"

[build]
  command = "npm run build:netlify"

[context.production]
  command = "npx prisma migrate deploy && npm run build:netlify"

[build.environment]
  NODE_VERSION = "20.18.0"
  NEXT_TELEMETRY_DISABLED = "1"
  PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK = "1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/product-images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[functions."automation-engine"]
  schedule = "*/5 * * * *"

[functions."daily-books-sync"]
  schedule = "0 6 * * *"

[functions."process-scheduled-messages"]
  schedule = "*/5 * * * *"

[functions."campaign-recovery-watchdog"]
  schedule = "* * * * *"

[functions."campaign-delivery-reconciliation"]
  schedule = "*/15 * * * *"

[functions."email-sync"]
  schedule = "*/3 * * * *"

[functions."operational-task-generator"]
  schedule = "*/15 * * * *"

[functions."bounded-books-auto-sync"]
  schedule = "*/15 * * * *"
